[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paytrace-ai"
version = "0.1.0"
description = "Payment auditing for freelancers, gig workers, and independent contractors"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Chaitanya Suralkar" }]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["paytrace"]

[tool.setuptools.package-data]
paytrace = ["templates.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
